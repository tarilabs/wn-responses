apiVersion: v1
kind: Secret
metadata:
  name: ogx-demo-secrets
stringData:
  # Inference credentials for the server.
  OPENAI_API_KEY: "replace-me"
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: wn-responses
spec:
  distribution:
    name: starter
  overrideConfig:
    name: ogx-demo-config
    key: config.yaml
  network:
    port: 8321
  workload:
    replicas: 1
    # The PVC is what makes an uploaded skill survive a restart. Skill metadata
    # goes to the KV store and the zip blob to the Files API, and both are
    # pointed at this mount in 01-ogx-config.yaml.
    storage:
      size: "10Gi"
      mountPath: "/.ogx"
    overrides:
      env:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: ogx-demo-secrets
            key: OPENAI_API_KEY
