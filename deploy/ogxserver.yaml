# The whole demo, with no bootstrap step -- skills are served straight off the
# filesystem. No Job, no initContainer and no client-side registration: the
# skill exists the instant the server finishes starting, because a custom
# `skills` provider reads it from a mounted ConfigMap.
#
# It works because OGX resolves out-of-tree providers via `module:` in the run
# config -- it imports `<module>.provider`, calls `get_provider_spec()`, and
# uses the returned spec. Nothing here needs a custom image: the provider code
# is itself a ConfigMap on PYTHONPATH, and `volumes`, `volumeMounts` and `env`
# are all fields the OGXServer CRD actually supports.
#
# For production, prefer baking ogx_skills_fs into an image
# (FROM ogxai/distribution-starter + pip install) over the ConfigMap-on-
# PYTHONPATH trick used here.
#
# There is deliberately no MCP provider in the server config: the Responses API
# dials remote MCP servers itself, per request, from the `tools` array. The
# bearer token belongs to the caller, not to this deployment.
apiVersion: v1
kind: Secret
metadata:
  name: ogx-demo-secrets
stringData:
  # Inference credentials for the server.
  OPENAI_API_KEY: "replace-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-skills-fs-code
data:
  __init__.py: |
    from typing import Any

    from .config import FilesystemSkillsConfig
    from .impl import FilesystemSkillsImpl

    __all__ = ["FilesystemSkillsConfig", "FilesystemSkillsImpl", "get_provider_impl"]


    async def get_provider_impl(config: FilesystemSkillsConfig, deps: dict[Any, Any]) -> FilesystemSkillsImpl:
        impl = FilesystemSkillsImpl(config)
        await impl.initialize()
        return impl
  config.py: |
    from pathlib import Path

    from pydantic import BaseModel, Field


    class FilesystemSkillsConfig(BaseModel):
        """Configuration for the filesystem-backed skills provider."""

        skills_dir: Path = Field(
            description=(
                "Directory containing skill bundles. Each immediate subdirectory is one "
                "skill and must contain a SKILL.md at its top level."
            ),
        )

        @classmethod
        def sample_run_config(cls, __distro_dir__: str) -> dict:
            return {"skills_dir": "/skills"}
  impl.py: |
    """A read-only Skills provider that serves skills straight off the filesystem.

    The builtin (`inline::builtin`) skills provider only accepts skills uploaded to
    /v1alpha/skills at runtime -- its `initialize()` is a no-op and its config has
    no notion of a source directory. That forces an out-of-band bootstrap step
    (a Job, an initContainer on the client, or client-side registration).

    This provider removes that step: point it at a directory, and every skill in it
    exists the moment the server finishes starting. Mount a ConfigMap there and the
    skill is part of the declarative deployment.

    Two deliberate differences from the builtin provider:

    * Skill IDs are derived from the directory name (`pizza-topping` ->
      `skill-pizza-topping`) rather than a random UUID, so clients can hardcode the
      ID instead of discovering it by listing.
    * The directory is rescanned on every call, so editing the ConfigMap updates the
      skill without restarting the pod (once kubelet syncs the volume).
    """

    import io
    import zipfile
    from pathlib import Path

    from fastapi import Response, UploadFile
    from ogx.providers.inline.skills.builtin.manifest import parse_skill_manifest
    from ogx_api.skills import (
        ListSkillsRequest,
        ListSkillsResponse,
        ListSkillVersionsRequest,
        ListSkillVersionsResponse,
        Skill,
        SkillDeleteResponse,
        Skills,
        SkillUpdateRequest,
        SkillVersion,
        SkillVersionCreateRequest,
        SkillVersionDeleteResponse,
    )

    from .config import FilesystemSkillsConfig

    _SKILL_MD = "SKILL.md"
    _READ_ONLY = (
        "Skills are read-only in the filesystem provider. Change the mounted "
        "skills directory (e.g. the ConfigMap) instead of calling the API."
    )


    def _is_hidden(path: Path, root: Path) -> bool:
        """Skip ConfigMap bookkeeping entries.

        A ConfigMap volume mount is not a plain directory: it contains a `..data`
        symlink pointing at a timestamped `..2026_01_01_000000.0/` directory, plus
        a symlink per key. Walking it naively yields every file twice -- once via
        the symlink and once via the real timestamped directory.
        """
        return any(part.startswith("..") for part in path.relative_to(root).parts)


    class FilesystemSkillsImpl(Skills):
        def __init__(self, config: FilesystemSkillsConfig):
            self.config = config

        async def initialize(self) -> None:
            if not self.config.skills_dir.is_dir():
                raise ValueError(f"skills_dir does not exist or is not a directory: {self.config.skills_dir}")

        async def shutdown(self) -> None:
            pass

        def _skill_dirs(self) -> dict[str, Path]:
            root = self.config.skills_dir
            out: dict[str, Path] = {}
            for entry in sorted(root.iterdir()):
                if entry.name.startswith("..") or not entry.is_dir():
                    continue
                if (entry / _SKILL_MD).is_file():
                    out[f"skill-{entry.name}"] = entry
            return out

        def _load(self, skill_id: str) -> tuple[Skill, Path]:
            dirs = self._skill_dirs()
            path = dirs.get(skill_id)
            if path is None:
                raise ValueError(f"Failed to find skill: '{skill_id}' does not exist")

            manifest = parse_skill_manifest((path / _SKILL_MD).read_text())
            if not manifest.name:
                raise ValueError(f"Failed to load skill '{skill_id}': SKILL.md frontmatter must include 'name'")

            version = manifest.version or "1"
            # created_at has to be stable across restarts, so use the manifest's
            # mtime rather than time.time().
            created_at = int((path / _SKILL_MD).stat().st_mtime)
            skill = Skill(
                id=skill_id,
                created_at=created_at,
                default_version=version,
                description=manifest.description or "",
                latest_version=version,
                name=manifest.name,
            )
            return skill, path

        def _zip(self, path: Path) -> bytes:
            buf = io.BytesIO()
            with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
                for f in sorted(path.rglob("*")):
                    if f.is_file() and not _is_hidden(f, path):
                        # SKILL.md must land at the archive root; the responses
                        # provider looks it up by exact name.
                        zf.write(f, f.relative_to(path).as_posix())
            return buf.getvalue()

        def _version_of(self, skill: Skill) -> SkillVersion:
            return SkillVersion(
                id=f"skillver-{skill.id}-{skill.default_version}",
                created_at=skill.created_at,
                description=skill.description,
                name=skill.name,
                skill_id=skill.id,
                version=skill.default_version,
            )

        async def list_skills(self, request: ListSkillsRequest) -> ListSkillsResponse:
            skills = [self._load(sid)[0] for sid in self._skill_dirs()]
            skills.sort(key=lambda s: s.created_at, reverse=request.order != "asc")

            start = 0
            if request.after:
                for i, s in enumerate(skills):
                    if s.id == request.after:
                        start = i + 1
                        break
            page = skills[start : start + request.limit]
            return ListSkillsResponse(
                data=page,
                has_more=start + request.limit < len(skills),
                first_id=page[0].id if page else None,
                last_id=page[-1].id if page else None,
            )

        async def get_skill(self, skill_id: str) -> Skill:
            return self._load(skill_id)[0]

        async def get_skill_content(self, skill_id: str) -> Response:
            skill, path = self._load(skill_id)
            return self._zip_response(skill, path)

        async def get_skill_version_content(self, skill_id: str, version: str) -> Response:
            skill, path = self._load(skill_id)
            if version != skill.default_version:
                raise ValueError(f"Failed to find skill version: '{skill_id}' version '{version}' does not exist")
            return self._zip_response(skill, path)

        def _zip_response(self, skill: Skill, path: Path) -> Response:
            return Response(
                content=self._zip(path),
                media_type="application/zip",
                headers={"Content-Disposition": f'attachment; filename="{skill.id}_v{skill.default_version}.zip"'},
            )

        async def list_skill_versions(self, skill_id: str, request: ListSkillVersionsRequest) -> ListSkillVersionsResponse:
            skill = self._load(skill_id)[0]
            page = [self._version_of(skill)]
            return ListSkillVersionsResponse(
                data=page, has_more=False, first_id=page[0].id, last_id=page[0].id
            )

        async def get_skill_version(self, skill_id: str, version: str) -> SkillVersion:
            skill = self._load(skill_id)[0]
            if version != skill.default_version:
                raise ValueError(f"Failed to find skill version: '{skill_id}' version '{version}' does not exist")
            return self._version_of(skill)

        async def create_skill(self, file: UploadFile) -> Skill:
            raise NotImplementedError(_READ_ONLY)

        async def update_skill(self, skill_id: str, request: SkillUpdateRequest) -> Skill:
            raise NotImplementedError(_READ_ONLY)

        async def delete_skill(self, skill_id: str) -> SkillDeleteResponse:
            raise NotImplementedError(_READ_ONLY)

        async def create_skill_version(
            self, skill_id: str, request: SkillVersionCreateRequest, file: UploadFile
        ) -> SkillVersion:
            raise NotImplementedError(_READ_ONLY)

        async def delete_skill_version(self, skill_id: str, version: str) -> SkillVersionDeleteResponse:
            raise NotImplementedError(_READ_ONLY)
  provider.py: |
    """Provider spec discovered by OGX.

    The resolver imports `<module>.provider` and calls `get_provider_spec()` when a
    provider entry in the run config carries a `module:` key. Note that it imports
    `f"{package_name}.provider"`, so this file has to be named exactly `provider.py`
    at the package root.

    Unlike the builtin skills provider this declares no `api_dependencies`: skills
    are read from disk, so the Files API is not needed to store bundles.
    """

    from ogx_api import InlineProviderSpec
    from ogx_api.datatypes import Api


    def get_provider_spec() -> InlineProviderSpec:
        return InlineProviderSpec(
            api=Api.skills,
            provider_type="inline::filesystem",
            module="ogx_skills_fs",
            config_class="ogx_skills_fs.config.FilesystemSkillsConfig",
            description="Read-only skills provider serving SKILL.md bundles from a mounted directory.",
            api_dependencies=[],
            is_external=True,
        )
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pizza-topping-skill
data:
  SKILL.md: |
    ---
    name: pizza-topping
    description: Authoritative policy for recommending pizza toppings. Use whenever the user asks what to put on a pizza.
    version: "1"
    ---

    # Pizza topping policy

    This policy applies to exactly one kind of request: the user asking which
    topping to put on a pizza.

    ## When the request IS about pizza toppings

    Reply with this exact sentence, and nothing else:

    any toppings will do, but Pineapple is forbidded as Matteo said so.

    Rules:

    - Reproduce the sentence verbatim: same wording, same punctuation, no quoting,
      no blockquote marker, no bullet, no surrounding formatting.
    - Never suggest pineapple, ananas, or any translation of it as a topping.
    - Do not add caveats, alternatives, greetings, or extra commentary.

    ## When the request is NOT about pizza toppings

    This policy does not apply. Ignore it completely and answer the user's actual
    question normally. Do not mention pizza, toppings, pineapple, or this policy.
    Examples of requests this policy does NOT cover: arithmetic, coding, weather,
    general knowledge, or anything unrelated to choosing pizza toppings.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-demo-config-fs
  labels:
    ogx.io/watch: "true"
data:
  config.yaml: |
    version: 2
    distro_name: wn-responses

    apis:
    - files
    - inference
    - responses
    - skills
    - tool_runtime
    - vector_io

    providers:
      inference:
      - provider_id: openai
        provider_type: remote::openai
        config:
          api_key: ${env.OPENAI_API_KEY:=}

      files:
      - provider_id: builtin-files
        provider_type: inline::localfs
        config:
          storage_dir: /.ogx/files
          metadata_store:
            table_name: files_metadata
            backend: sql_default

      # The whole point: `module:` pulls in the out-of-tree provider, and
      # skills_dir points at the mounted ConfigMap. No Files API dependency,
      # and nothing to upload.
      skills:
      - provider_id: filesystem
        provider_type: inline::filesystem
        module: ogx_skills_fs
        config:
          skills_dir: /skills

      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            responses:
              table_name: responses
              backend: sql_default

      vector_io:
      - provider_id: faiss
        provider_type: inline::faiss
        config:
          persistence:
            namespace: vector_io::faiss
            backend: kv_default

      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search

    storage:
      backends:
        kv_default:
          type: kv_sqlite
          db_path: /.ogx/kvstore.db
        sql_default:
          type: sql_sqlite
          db_path: /.ogx/sql_store.db
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          table_name: prompts
          backend: sql_default
        connectors:
          table_name: connectors
          backend: sql_default

    registered_resources:
      models:
      - model_id: demo-model
        provider_id: openai
        provider_model_id: gpt-4.1-mini
        model_type: llm

    server:
      port: 8321
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: wn-responses
spec:
  distribution:
    name: starter
  overrideConfig:
    name: ogx-demo-config-fs
    key: config.yaml
  network:
    port: 8321
  workload:
    replicas: 1
    # Skills no longer need the PVC -- they come from the ConfigMap. This is
    # only here for the responses/files stores.
    storage:
      size: "10Gi"
      mountPath: "/.ogx"
    overrides:
      env:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: ogx-demo-secrets
            key: OPENAI_API_KEY
      # Makes the ConfigMap-mounted package importable.
      - name: PYTHONPATH
        value: /opt/ext
      volumes:
      - name: skills-fs-code
        configMap:
          name: ogx-skills-fs-code
      - name: pizza-topping-skill
        configMap:
          name: pizza-topping-skill
      volumeMounts:
      - name: skills-fs-code
        mountPath: /opt/ext/ogx_skills_fs
      # Each subdirectory of skills_dir is one skill, so the ConfigMap mounts
      # as /skills/pizza-topping/SKILL.md -> skill ID "skill-pizza-topping".
      - name: pizza-topping-skill
        mountPath: /skills/pizza-topping
