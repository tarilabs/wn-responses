# Production-ready deployment: ogx_skills_fs is baked into a custom image built
# on UBI Python, so no ConfigMap-on-PYTHONPATH trick is needed. The run config
# is generated by Kustomize from deploy/config.yaml with ogx.io/watch for
# live-reload agility.
#
# There is deliberately no MCP provider in the server config: the Responses API
# dials remote MCP servers itself, per request, from the `tools` array. The
# bearer token belongs to the caller, not to this deployment.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: wn-responses
spec:
  distribution:
    image: quay.io/mmortari/wn-responses:latest
  overrideConfig:
    name: ogx-demo-config-fs
    key: config.yaml
  network:
    port: 8321
  workload:
    replicas: 1
    storage:
      size: "10Gi"
      mountPath: "/.ogx"
    overrides:
      env:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: ogx-demo-secrets
            key: OPENAI_API_KEY
      volumes:
      - name: pizza-topping-skill
        configMap:
          name: pizza-topping-skill
      volumeMounts:
      - name: pizza-topping-skill
        mountPath: /skills/pizza-topping
