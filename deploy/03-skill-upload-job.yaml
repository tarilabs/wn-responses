# How a skill gets into an OGXServer.
#
# The operator has no concept of skills -- there is no CRD field that mounts a
# SKILL.md, and grepping ogx-k8s-operator for "skill" only turns up the `skills`
# entry in the sample config's `apis` list. A skill is a *runtime API object*,
# not a file the server reads from disk, so it has to be POSTed to
# /v1alpha/skills after the server is up.
#
# So: keep SKILL.md in a ConfigMap as the source of truth, and run this Job to
# zip it and upload it. The Job is idempotent -- re-running it pushes a new
# default version of the same skill rather than creating a duplicate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pizza-topping-skill
data:
  SKILL.md: |
    ---
    name: pizza-topping
    description: Authoritative policy for recommending pizza toppings. Use whenever the user asks what to put on a pizza.
    version: "1"
    ---

    # Pizza topping policy

    This policy applies to exactly one kind of request: the user asking which
    topping to put on a pizza.

    ## When the request IS about pizza toppings

    Reply with this exact sentence, and nothing else:

    any toppings will do, but Pineapple is forbidded as Matteo said so.

    Rules:

    - Reproduce the sentence verbatim: same wording, same punctuation, no quoting,
      no blockquote marker, no bullet, no surrounding formatting.
    - Never suggest pineapple, ananas, or any translation of it as a topping.
    - Do not add caveats, alternatives, greetings, or extra commentary.

    ## When the request is NOT about pizza toppings

    This policy does not apply. Ignore it completely and answer the user's actual
    question normally. Do not mention pizza, toppings, pineapple, or this policy.
    Examples of requests this policy does NOT cover: arithmetic, coding, weather,
    general knowledge, or anything unrelated to choosing pizza toppings.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pizza-topping-skill-upload
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: upload
        image: python:3.12-slim
        env:
        - name: OGX_URL
          value: http://wn-responses-service:8321
        volumeMounts:
        - name: skill
          mountPath: /skill
        command: ["python", "-c"]
        args:
        - |
          import io, json, os, pathlib, time, urllib.error, urllib.request, zipfile

          base = os.environ["OGX_URL"]
          src = pathlib.Path("/skill")

          # SKILL.md has to be at the archive root. Nesting it inside a
          # top-level folder -- which is what OpenAI's hosted Skills API
          # expects -- makes OGX reject the bundle with
          # "SKILL.md not found at archive root".
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(src.rglob("*")):
                  if p.is_file() and not p.name.startswith(".."):
                      zf.write(p, p.relative_to(src).as_posix())
          bundle = buf.getvalue()

          def multipart(fields, files):
              b = "----ogx%d" % time.time_ns()
              out = b""
              for k, v in fields.items():
                  out += ("--%s\r\nContent-Disposition: form-data; name=\"%s\"\r\n\r\n%s\r\n" % (b, k, v)).encode()
              for k, (fn, data) in files.items():
                  out += ("--%s\r\nContent-Disposition: form-data; name=\"%s\"; filename=\"%s\"\r\n"
                          "Content-Type: application/zip\r\n\r\n" % (b, k, fn)).encode() + data + b"\r\n"
              out += ("--%s--\r\n" % b).encode()
              return out, "multipart/form-data; boundary=%s" % b

          def call(url, data=None, ctype=None, method="GET"):
              req = urllib.request.Request(url, data=data, method=method)
              if ctype:
                  req.add_header("Content-Type", ctype)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          # Wait for the server to come up.
          for _ in range(60):
              try:
                  call(base + "/v1/health"); break
              except Exception as e:
                  print("waiting for OGX:", e); time.sleep(5)
          else:
              raise SystemExit("OGX server never became healthy")

          skills_url = base + "/v1alpha/skills"
          existing = next((s for s in call(skills_url)["data"] if s["name"] == "pizza-topping"), None)

          # The multipart field is named `file` (singular). The OpenAI SDK's
          # client.skills.create() sends `files` to /v1/skills and does not
          # work against OGX 1.3.1.
          if existing:
              body, ctype = multipart({"default": "true"}, {"file": ("pizza-topping.zip", bundle)})
              got = call("%s/%s/versions" % (skills_url, existing["id"]), body, ctype, "POST")
              print("updated skill %s to version %s" % (existing["id"], got["version"]))
          else:
              body, ctype = multipart({}, {"file": ("pizza-topping.zip", bundle)})
              got = call(skills_url, body, ctype, "POST")
              print("created skill", got["id"])
      volumes:
      - name: skill
        configMap:
          name: pizza-topping-skill
